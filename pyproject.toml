[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-manipulator"
version = "0.1.0"
description = "A simulation-first robot manipulation learning project."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  # MuJoCo 3.4+ does not publish a macOS Python 3.9 wheel.
  "mujoco>=3.2,<3.4; python_version < '3.10' and sys_platform == 'darwin'",
  "mujoco>=3.2,<4; python_version >= '3.10' or sys_platform != 'darwin'",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
ml = [
  "torch>=2.2,<3",
]

[project.scripts]
buddy-arm-demo = "buddy_manipulator.demo:main"
buddy-collect-demos = "buddy_manipulator.collect_demos:main"
buddy-grasp-demo = "buddy_manipulator.grasp_demo:main"
buddy-evaluate-bc = "buddy_manipulator.evaluate_bc:main"
buddy-teleop = "buddy_manipulator.teleop_demo:main"
buddy-train-bc = "buddy_manipulator.train_bc:main"
buddy-validate-dataset = "buddy_manipulator.validate_dataset:main"
buddy-vision-demo = "buddy_manipulator.vision_demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buddy_manipulator = ["models/*.xml"]
